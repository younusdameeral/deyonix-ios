workflows:
  deyonix-ios:
    name: Deyonix iOS -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore          # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY, CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: "comdameeral.deyonix"
        APP_STORE_APPLE_ID: 6837711362
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Prepare app files
        script: |
          # The files were uploaded flat (no folders), so put them where the build expects them
          mkdir -p www resources
          cp index.html manifest.json sw.js privacy.html terms.html support.html www/
          cp icon-192.png icon-512.png apple-touch-icon.png logo.jpg www/
          [ -f AppIcon-1024.png ] && cp AppIcon-1024.png resources/ || true
          [ -f splash-2732.png ] && cp splash-2732.png resources/ || true
          ls www resources
      - name: Install packages
        script: npm install
      - name: Create iOS project
        script: |
          npx cap add ios
          npx cap sync ios
      - name: App icon, splash and permissions
        script: |
          ICON_DIR=ios/App/App/Assets.xcassets/AppIcon.appiconset
          rm -f $ICON_DIR/*.png
          cp resources/AppIcon-1024.png $ICON_DIR/AppIcon-512@2x.png
          cat > $ICON_DIR/Contents.json <<'JSON'
          {"images":[{"filename":"AppIcon-512@2x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          SPL=ios/App/App/Assets.xcassets/Splash.imageset
          for f in splash-2732x2732.png splash-2732x2732-1.png splash-2732x2732-2.png; do cp resources/splash-2732.png $SPL/$f; done
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Deyonix" $PL || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Deyonix" $PL
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PL
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Deyonix uses your location so shops and drivers can find you, because there are no street addresses." $PL
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Deyonix uses the camera so you can add photos to your ads, shop and messages." $PL
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Deyonix uses your photos so you can add pictures to your ads, shop and messages." $PL
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PL
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PL
      - name: Code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build the app
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
