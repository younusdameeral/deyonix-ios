<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Deyonix</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9480f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Sans+Arabic:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--bg:#faf6ef;--card:#fff;--ink:#2a2118;--muted:#7a6d5f;--accent:#d9480f;--accent-2:#f08c00;--green:#2b8a3e;--line:#eadfce;--red:#c92a2a}
  body.owner{--accent:#1864ab;--accent-2:#1c7ed6}
  body.admin{--accent:#5f3dc4;--accent-2:#7950f2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Tajawal','Noto Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:calc(150px + var(--sab))}
  button{font-family:inherit;cursor:pointer;border:none}
  header{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;padding:20px 18px 24px;padding-top:calc(20px + var(--sat));border-radius:0 0 24px 24px}
  header h1{font-size:26px;font-weight:800}
  header p{opacity:.92;margin-top:4px;font-size:15px}
  .role{display:inline-block;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:8px;font-size:13px;margin-bottom:8px}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .back{background:rgba(255,255,255,.22);color:#fff;padding:6px 12px;border-radius:10px;font-size:14px;margin-bottom:10px}
  h2{font-size:19px;margin:20px 0 10px}
  .card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;width:100%;text-align:start;color:inherit}
  .ic{font-size:32px;width:56px;height:56px;display:grid;place-items:center;background:#fff1e6;border-radius:14px;flex-shrink:0}
  .card b{font-size:17px;display:block}
  small,.muted{color:var(--muted);font-size:13px}
  .grow{flex:1}
  .tag{display:inline-block;border-radius:7px;padding:2px 8px;font-size:12px;font-weight:700}
  .t-green{background:#e7f5ea;color:var(--green)} .t-red{background:#fff0f0;color:var(--red)}
  .t-orange{background:#fff4e0;color:#d9480f} .t-blue{background:#e7f1fb;color:#1864ab} .t-gray{background:#f1ede7;color:var(--muted)}
  .item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
  .item b{font-size:16px}
  .pr{color:var(--accent);font-weight:700;font-size:14px;margin-top:2px}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:34px;height:34px;border-radius:10px;font-size:20px;font-weight:700;background:#fff1e6;color:var(--accent)}
  .qty button.add{background:var(--accent);color:#fff}
  .qty span{min-width:18px;text-align:center;font-weight:700}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  label{display:block;font-weight:700;margin:12px 0 6px;font-size:15px}
  input,textarea{width:100%;font-family:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fffdf9;color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--accent-2)}
  textarea{min-height:64px;resize:vertical}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--accent);color:#fff;padding:14px;border-radius:14px;font-size:17px;font-weight:800;margin-top:12px}
  .btn.light{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
  .btn.wa{background:#25d366} .btn.off{background:#b9b0a5;pointer-events:none}
  .btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:6px 0 0;margin-inline-end:6px;border-radius:10px}
  .btn.red{background:var(--red)} .btn.green{background:var(--green)} .btn.gray{background:#8a7f73}
  .loc{width:100%;background:#e7f5ea;color:var(--green);padding:13px;border-radius:12px;font-size:16px;font-weight:700;border:1.5px dashed var(--green)}
  .loc.ok{background:var(--green);color:#fff;border-style:solid}
  .hint{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.6}
  .err{color:var(--red);font-size:14px;margin-top:8px;font-weight:500}
  .row{display:flex;justify-content:space-between;padding:5px 0;font-size:15px;gap:10px}
  .row.t{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:800}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .roles button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-size:15px;font-weight:700;color:var(--ink)}
  .roles button span{display:block;font-size:30px;margin-bottom:4px}
  .roles button.sel{border-color:var(--accent);background:#fff1e6}
  .switch{text-align:center;margin-top:14px;font-size:15px}
  .switch a{color:var(--accent);font-weight:700;cursor:pointer}
  .demo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .demo button{background:#f1ede7;border-radius:12px;padding:10px 4px;font-size:13px;font-weight:700;color:var(--ink)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .stat b{font-size:24px;display:block;color:var(--accent)}
  .tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:var(--sab)}
  .tabs .in{display:flex;max-width:560px;width:100%}
  .tabs button{flex:1;background:none;padding:9px 2px 11px;font-size:12px;color:var(--muted);font-weight:700;position:relative}
  .tabs button span{display:block;font-size:22px}
  .tabs button.on{color:var(--accent)}
  .dot{position:absolute;top:5px;left:50%;margin-left:6px;background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:0 6px}
  .cartbar{position:fixed;bottom:calc(66px + var(--sab));left:0;right:0;padding:0 14px;z-index:4}
  .cartbar button{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:532px;margin:0 auto;background:var(--ink);color:#fff;padding:15px 18px;border-radius:16px;font-size:17px;font-weight:700}
  .cartbar .n{background:var(--accent);border-radius:8px;padding:2px 9px;font-size:14px}
  .brand{display:block;width:min(300px,78%);margin:16px auto 0;border-radius:22px;box-shadow:0 8px 26px rgba(0,0,0,.25)}
  .icons{display:flex;flex-wrap:wrap;gap:8px}
  .icons button{font-size:24px;width:46px;height:46px;border-radius:12px;background:#fff1e6;border:2px solid transparent}
  .icons button.sel{border-color:var(--accent);background:#ffe3cf}
  .mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
  .del{background:#fff0f0;color:var(--red);padding:6px 10px;border-radius:9px;font-size:13px}
  .order{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
  .order .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .order a{color:var(--accent)}
  .toggle{display:flex;justify-content:space-between;align-items:center}
  .empty{text-align:center;color:var(--muted);padding:30px 0}
  .loading{text-align:center;padding:60px 0;color:var(--muted);font-size:16px}
  .langs{display:flex;gap:8px;justify-content:center;margin:16px 0 4px;flex-wrap:wrap}
  .langs button{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:7px 14px;font-size:14px;font-weight:700;color:var(--ink)}
  .langs button.ck{font-family:'Noto Sans Arabic',sans-serif}
  .langs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  html[lang="ckb"] body, html[lang="ckb"] button, html[lang="ckb"] input, html[lang="ckb"] textarea{font-family:'Noto Sans Arabic',system-ui,sans-serif}
  .card small{display:block}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);position:relative}
  .tile span{font-size:34px} .tile b{font-size:15px}
  .tile small{position:absolute;top:8px;inset-inline-end:10px;background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:7px 12px;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .thumb{width:56px;height:56px;border-radius:14px;object-fit:cover;flex-shrink:0;background:#fff1e6}
  .cover{width:100%;height:190px;object-fit:cover;border-radius:16px;margin-top:14px;background:#eee;display:block}
  .pthumb{width:52px;height:52px;border-radius:12px;object-fit:cover;margin-inline-end:10px;flex-shrink:0;background:#f1ede7}
  .item .grow{flex:1}
  .contact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .slots button{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 0;font-size:15px;font-weight:700;color:var(--ink)}
  .slots button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .slots button.taken{background:#eee;color:#bbb;text-decoration:line-through}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .lcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;text-align:start;color:var(--ink);display:flex;flex-direction:column;gap:3px}
  .lcard b{font-size:15px;line-height:1.3}
  .limg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#f1ede7;display:block}
  .limg.ph{display:grid;place-items:center;font-size:44px}
  .days{display:flex;flex-wrap:wrap;gap:6px}
  .days label{margin:0;font-weight:500;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;font-size:14px;display:flex;gap:4px;align-items:center}
  .days input{width:auto}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  select{width:100%;font-family:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fffdf9;color:var(--ink)}
  .seg{display:flex;background:#f1ede7;border-radius:12px;padding:4px;margin-top:14px}
  .seg button{flex:1;background:none;padding:9px 4px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--accent)}
  .photo-btn{background:#fff1e6;color:var(--accent);border:1.5px dashed var(--accent);border-radius:12px;padding:10px;width:100%;font-weight:700;font-size:15px;margin-top:8px}
  .mphoto{background:#fff1e6;border-radius:9px;font-size:16px;padding:6px 9px;margin-inline-end:6px}
  .big{font-size:22px;font-weight:800;margin-top:6px}
  .msgs{display:flex;flex-direction:column;gap:6px;padding:14px 0 80px}
  .bub{max-width:80%;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
  .bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-end-end-radius:4px}
  .bub.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-end-start-radius:4px}
  .bub small{display:block;font-size:11px;opacity:.75;margin-top:3px}
  .sendbar{position:fixed;bottom:calc(62px + var(--sab));left:0;right:0;padding:8px 14px;background:var(--bg);border-top:1px solid var(--line);z-index:4}
  .sendbar .in{display:flex;gap:8px;max-width:532px;margin:0 auto}
  .sendbar input{flex:1}
  .sendbar button{background:var(--accent);color:#fff;border-radius:12px;padding:0 16px;font-weight:800;font-size:15px}
  .sendbar .ib{background:#fff1e6;color:var(--accent);border-radius:12px;padding:0 11px;font-size:20px}
  .chatimg{display:block;max-width:220px;max-height:260px;width:100%;border-radius:12px;object-fit:cover;background:#eee;cursor:zoom-in}
  .bub.pic{padding:4px}
  .bub.me a{color:#fff}
  .zoom{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
  .zoom img{max-width:100%;max-height:100%;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-select:none}
  .zoom .zx{position:absolute;top:calc(12px + var(--sat));right:14px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:22px;z-index:2}
  .zoom .zh{position:absolute;bottom:calc(18px + var(--sab));left:0;right:0;text-align:center;color:#bbb;font-size:13px}
  img[data-img]:not(.thumb){cursor:zoom-in}
  .pagev{position:fixed;inset:0;z-index:45;background:#fff;display:flex;flex-direction:column}
  .pvbar{background:linear-gradient(135deg,var(--accent),var(--accent-2));padding:10px 14px;padding-top:calc(10px + var(--sat))}
  .pvbar .back{margin:0}
  .pagev iframe{flex:1;border:0;width:100%}
  #ptr{position:fixed;left:50%;top:calc(6px + var(--sat));transform:translate(-50%,-60px);z-index:40;width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent);opacity:0}
  #ptr.spin span{display:inline-block;animation:ptrs .8s linear infinite}
  @keyframes ptrs{to{transform:rotate(360deg)}}
  .lthumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .lth{position:relative}
  .lth img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:#f1ede7}
  .lth button{position:absolute;top:4px;inset-inline-end:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px}
  .lth span{position:absolute;bottom:4px;inset-inline-start:6px;color:#ffd43b;text-shadow:0 1px 3px #000}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;-webkit-overflow-scrolling:touch}
  .gal img{flex:0 0 100%;scroll-snap-align:center;height:260px;margin-top:14px}
  .galn{text-align:center;color:var(--muted);font-size:12px;margin-top:4px}
  .brand2{text-align:center;margin:18px auto 4px}
  .brand2 img{width:min(150px,40vw);display:block;margin:0 auto}
  .brand2 b{display:block;font-family:system-ui,-apple-system,sans-serif;font-weight:800;font-size:30px;color:var(--ink);direction:ltr;margin-top:2px}
  .brand2 b i{font-style:normal;color:#F7871E}
  .brand2 small{display:block;color:var(--muted);font-size:12px;letter-spacing:2px;direction:ltr}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;min-height:36px}
  .hx{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .hx .back{margin-bottom:0}
  .hx .role{margin-bottom:0}
  .lng{background:rgba(255,255,255,.22);color:#fff;border-radius:18px;height:36px;padding:0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:5px;flex:none;letter-spacing:.03em}
  html[dir=rtl] .lng{order:-1}
  .lmenu{position:fixed;top:calc(58px + var(--sat));right:12px;z-index:40;background:#fff;border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.22);padding:6px;min-width:190px;display:flex;flex-direction:column}
  .lmenu button{background:none;text-align:start;padding:12px 14px;border-radius:10px;font-size:16px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:12px}
  .lmenu button.on{background:#fff1e6;color:var(--accent)}
  .lmenu small{color:var(--muted);font-weight:800}
  body.chatv header{position:sticky;top:0;z-index:6;padding:12px 16px 12px;padding-top:calc(12px + var(--sat));border-radius:0 0 18px 18px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  body.chatv header h1{font-size:20px}
  body.chatv header p{font-size:14px;margin-top:2px}
  .topic{background:none;color:inherit;text-align:start;padding:0;display:block;width:100%}
  [hidden]{display:none!important}
  .pwwrap{position:relative;display:block}
  .pwwrap input{padding-inline-end:84px}
  .pweye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:#f1ede7;color:var(--ink);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:700;min-height:34px}
  .ccov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding-top:var(--sat)}
  .ccbox{background:#fff;width:100%;max-width:560px;height:82vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
  .cchead{display:flex;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
  .cchead input{flex:1}
  .ccx{background:#f1ede7;border-radius:12px;width:46px;font-size:18px}
  .cclist{overflow-y:auto;flex:1;padding:4px 8px 20px}
  .cclist button{display:flex;align-items:center;gap:12px;width:100%;background:none;padding:12px 8px;border-bottom:1px solid #f3ede4;font-size:16px;color:var(--ink);text-align:start}
  .cclist button span{font-size:22px;width:30px;text-align:center}
  .cclist button b{flex:1;font-weight:600}
  .cclist button small{color:var(--muted);font-weight:700}
  .toast{position:fixed;top:calc(10px + var(--sat));left:10px;right:10px;z-index:30;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;cursor:pointer;max-width:540px;margin:0 auto;animation:tin .25s ease-out}
  .toast b{display:block;font-size:15px} .toast span{font-size:14px;opacity:.85}
  @keyframes tin{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
  .bub.sel{outline:2px solid var(--accent-2)}
  .bub .delm{display:block;margin-top:6px;background:#fff;color:var(--red);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700}
  .bub.gone{background:transparent!important;color:var(--muted)!important;border:1px dashed var(--line)!important;font-style:italic}
  .chatrow{display:flex;align-items:stretch;gap:6px}
  .chatrow .card{flex:1;margin-bottom:10px}
  .chatdel{background:#fff0f0;color:var(--red);border-radius:14px;margin-bottom:10px;padding:0 12px;font-size:18px;min-width:48px}
  .chatdel.sure{font-size:12px;font-weight:700;max-width:90px}
  .cnt{background:var(--red);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;font-style:normal;align-self:center}
  .btn.msg{background:var(--accent)}
  .warn{background:#fff8db;border:1.5px dashed var(--accent-2);border-radius:14px;padding:12px;font-size:14px;line-height:1.6;margin-top:14px}
</style>
</head>
<body>
<div id="intro" style="position:fixed;inset:0;z-index:9999;background:#0a0a0b;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s">
  <div style="animation:introIn 1.3s cubic-bezier(.2,.7,.2,1) both;text-align:center">
    <img src="logo-mark.svg" alt="" style="width:min(220px,58vw);display:block;margin:0 auto">
    <div style="font-family:system-ui,-apple-system,sans-serif;font-weight:800;font-size:46px;color:#fff;letter-spacing:.5px;margin-top:6px;direction:ltr">Deyoni<span style="color:#F7871E">x</span></div>
    <div style="font-family:system-ui,-apple-system,sans-serif;color:#ddd;font-size:15px;letter-spacing:2px;margin-top:6px;direction:ltr">Buy <span style="color:#F7871E">•</span> Sell <span style="color:#F7871E">•</span> Everything</div>
  </div>
</div>

const imgCache={}, imgWait={};
const IMG=(id,cls="")=>id?`<img class="${cls}" data-img="${esc(id)}" alt="">`:"";
function hydrate(){
  if(!fs) return;
  document.querySelectorAll("img[data-img]").forEach(el=>{
    const id=el.dataset.img;
    if(imgCache[id]){ if(el.src!==imgCache[id]) el.src=imgCache[id]; return; }
    if(!imgWait[id]) imgWait[id]=fs.getDoc(fs.doc(fdb,"images",id)).then(s=>{
      if(s.exists()){ imgCache[id]=s.data().data; document.querySelectorAll(`img[data-img="${id}"]`).forEach(e=>e.src=imgCache[id]); }
    }).catch(()=>{});
  });
}
function shrink(f,maxDim){
  return new Promise((res,rej)=>{ const url=URL.createObjectURL(f), im=new Image();
    im.onload=()=>{ const sc=Math.min(1,maxDim/Math.max(im.width,im.height)); const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      let q=0.75, d=c.toDataURL("image/jpeg",q); while(d.length>230000&&q>0.3){ q-=0.1; d=c.toDataURL("image/jpeg",q); }
      URL.revokeObjectURL(url); res(d); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej("bad"); }; im.src=url; });
}
function pickFiles(){
  return new Promise(res=>{ const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.multiple=true; inp.style.display="none";
    document.body.appendChild(inp); inp.onchange=()=>{ const f=[...inp.files].slice(0,6); inp.remove(); res(f); }; inp.click(); });
}
function pickPhoto(maxDim){
  return new Promise((res,rej)=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.style.display="none";
    document.body.appendChild(inp);
    inp.onchange=()=>{ const f=inp.files[0]; inp.remove(); if(!f) return rej("none");
      const url=URL.createObjectURL(f), im=new Image();
      im.onload=()=>{ const sc=Math.min(1,maxDim/Math.max(im.width,im.height)); const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        let q=0.75, d=c.toDataURL("image/jpeg",q); while(d.length>230000&&q>0.3){ q-=0.1; d=c.toDataURL("image/jpeg",q); }
        URL.revokeObjectURL(url); res(d); };
      im.onerror=()=>{ URL.revokeObjectURL(url); rej("bad"); }; im.src=url; };
    inp.click();
  });
}

}

/* =========================================================

   ========================================================= */
async function init(){
  try{
    fa = await import(FB+"firebase-auth.js");
    fs = await import(FB+"firebase-firestore.js");
    const app = (await import(FB+"firebase-app.js")).initializeApp(firebaseConfig);
    // In the iPhone app (Capacitor) getAuth() can hang, so set storage directly
    const native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    auth = (native && fa.initializeAuth) ? fa.initializeAuth(app,{persistence:[fa.indexedDBLocalPersistence, fa.browserLocalPersistence]}) : fa.getAuth(app);
    fdb = fs.getFirestore(app);   // memory cache: Safari had trouble with the saved offline cache (failed-precondition)
  }catch(e){ $("#app").innerHTML=`<div class="loading">${t("noconn")}</div>`; return; }
  fa.onAuthStateChanged(auth, u=>{
    stopListeners(); me=null; reset();
    if(!u){ ready=true; tab=null; if(view!=="signup"&&view!=="verify") view="login"; document.body.dataset.view=""; render(); return; }
    ready=false; render();
    unsubs.push(fs.onSnapshot(fs.doc(fdb,"users",u.uid), snap=>{
      if(!snap.exists()){
        if(signingUp) return;                                   // still finishing sign-up
        if(!pendPw){ fa.deleteUser(u).catch(()=>fa.signOut(auth)); alertBox(t("signup_incomplete")); }   // left half-way: clean up
        return; }
      const first=!me || me.role!==snap.data().role;
      me={uid:u.uid,...snap.data()};
      if(first) startListeners();
      ready=true; render();
    }, e=>{ ready=true; $("#app").innerHTML=`<div class="loading">${errMsg(e)}</div>`; }));
  });
}

function stopListeners(){ unsubs.forEach(f=>{try{f()}catch(e){}}); unsubs=[]; stopSlots(); stopMsgs(); }
function listen(q,set){ unsubs.push(fs.onSnapshot(q, snap=>{ set(snap.docs.map(d=>({id:d.id,...d.data()}))); render(); }, e=>console.warn(e))); }

function startListeners(){
  const keep=unsubs.shift(); unsubs.forEach(f=>{try{f()}catch(e){}}); unsubs=[]; if(keep) unsubs.push(keep); marketOn=false;

const slideEls=()=>[document.querySelector("header"),$("#app")];
function slideTo(px,anim){ slideEls().forEach(el=>{ if(!el) return; el.style.transition=anim?"transform .22s ease-out":"none"; el.style.transform=px?`translateX(${px}px)`:""; }); }
document.addEventListener("touchstart",e=>{
  if(!curBack||e.touches.length!==1||document.querySelector(".lmenu,.zoom")) return;
  const x=e.touches[0].clientX, W=window.innerWidth, edge=30;
  if(x<=edge) sw={x0:x,y0:e.touches[0].clientY,dir:1,dx:0,ok:null};
  else if(x>=W-edge) sw={x0:x,y0:e.touches[0].clientY,dir:-1,dx:0,ok:null};
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!sw) return; const tx=e.touches[0].clientX, ty=e.touches[0].clientY;
  const dx=(tx-sw.x0)*sw.dir, dy=Math.abs(ty-sw.y0);
  if(sw.ok===null && (dx>10||dy>10)) sw.ok = dx>dy;           // decide: sideways swipe or normal scrolling
  if(!sw.ok){ if(sw.ok===false){ slideTo(0); sw=null; } return; }
  sw.dx=Math.max(0,dx); slideTo(sw.dx*sw.dir*0.9);
},{passive:true});
function endSwipe(){ if(!sw) return; const done=sw.ok&&sw.dx>Math.min(110,window.innerWidth*0.28), dir=sw.dir; sw=null;
  if(done){ slideTo(dir*window.innerWidth,true); setTimeout(()=>{ slideTo(0); runBack(); },180); } else slideTo(0,true); }
document.addEventListener("touchend",endSwipe,{passive:true});
document.addEventListener("touchcancel",()=>{ sw=null; slideTo(0); },{passive:true});

async function sendCode(){
  if(!pend){ go("signup"); return; }
  const cc=$("#vcc")?$("#vcc").value:pend.cc, num=$("#vp")?$("#vp").value:pend.num, k=phoneKey(cc,num);
  if(digits(k).length<7){ $("#verr").textContent=t("bad_phone"); return; }

    auth.languageCode=({ar:"ar",ckb:"ar",tr:"tr",en:"en"})[lang];
    vst.conf=await fa.signInWithPhoneNumber(auth,e164,getRV());
    vst.sent=true; vst.phone=e164; vst.left=60; redrawVerify();
  }catch(e){ console.warn(e); resetRV(); if($("#vsend")) $("#vsend").textContent=t("send_code"); if($("#verr")) $("#verr").textContent=errMsg(e); }

async function confirmCode(){

  $("#vbtn").textContent="⏳ ..."; $("#verr").textContent=""; signingUp=true;

    const cred=await vst.conf.confirm(code); u=cred.user;

    const login = pend.mode==="email" ? pend.em : keyEmail(pend.p);

function startBook(){ bookDate=null; bookTime=null; taken=new Set(); go("book"); }
function bookDays(s){ const out=[], now=new Date(); for(let i=0;i<14&&out.length<10;i++){ const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i); if(s.schedule.days.includes(d.getDay())) out.push(d);} return out; }
function daySlots(s,key){
  const [fh,fm]=s.schedule.from.split(":").map(Number), [th,tm]=s.schedule.to.split(":").map(Number), len=Number(s.schedule.slot)||30;
  const now=new Date(), isToday=key===ymd(now), out=[];
  for(let m=fh*60+fm; m+len<=th*60+tm; m+=len){ if(isToday && m<=now.getHours()*60+now.getMinutes()) continue;
    out.push(`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`); }
  return out;
}
function stopSlots(){ if(slotUnsub){ try{slotUnsub()}catch(e){} slotUnsub=null; } }
function watchSlots(){ stopSlots(); taken=new Set(); if(!bookDate) return;
  slotUnsub=fs.onSnapshot(fs.query(fs.collection(fdb,"slots"),fs.where("bizId","==",shop.id),fs.where("date","==",bookDate)),
    snap=>{ taken=new Set(snap.docs.map(d=>d.data().time)); if(taken.has(bookTime)) bookTime=null; drawSlots(); }, e=>console.warn(e)); }
function vBook(){
  const s=shop;
  H(t("book_title"),`${s.icon} ${esc(s.name)}`,backBtn("stopSlots();go('biz')"));
  A(`<h2>${t("pick_day")}</h2><div class="chips" id="days">${bookDays(s).map(d=>{const k=ymd(d); return `<button data-k="${k}" class="${bookDate===k?'on':''}" onclick="pickDay('${k}')">${dayLabel(d)}</button>`;}).join("")}</div>
    <h2>${t("pick_time")}</h2><div id="slots" class="slots"></div>
    <div class="box" style="margin-top:14px"><label>${t("name")}</label><input id="bn" value="${esc(me.name)}">
      <label>${t("phone")}</label><input id="bp" type="tel" dir="ltr" value="${esc(me.phone)}">
      <label>${t("notes")}</label><input id="bnote"></div>
    <button class="btn" id="bk" onclick="confirmBook()">${t("confirm_book")}</button><div class="err" id="bkErr"></div>`);
  drawSlots();
}
function pickDay(k){ bookDate=k; bookTime=null; document.querySelectorAll("#days button").forEach(b=>b.classList.toggle("on",b.dataset.k===k)); watchSlots(); drawSlots(); }
function pickTime(x){ bookTime=x; drawSlots(); }
function drawSlots(){
  const el=$("#slots"); if(!el) return;
  if(!bookDate){ el.innerHTML=`<div class="hint" style="grid-column:1/-1">☝️ ${t("pick_day")}</div>`; return; }
  const sl=daySlots(shop,bookDate);
  el.innerHTML=sl.length?sl.map(x=>`<button dir="ltr" class="${taken.has(x)?'taken':''} ${bookTime===x?'on':''}" ${taken.has(x)?'disabled':''} onclick="pickTime('${x}')">${x}</button>`).join(""):`<div class="hint" style="grid-column:1/-1">${t("no_slots")}</div>`;
}

function beep(){ try{ if(!audioCtx) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type="sine"; o.frequency.value=880;
  g.gain.setValueAtTime(0.0001,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.25,audioCtx.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.35);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.4); }catch(e){} }
function notify(title,body,go){
  beep(); try{ navigator.vibrate&&navigator.vibrate([120,60,120]); }catch(e){}
  const d=document.createElement("div"); d.className="toast"; d.innerHTML=`<div style="font-size:22px">🔔</div><div><b></b><span></span></div>`;
  d.querySelector("b").textContent=title; d.querySelector("span").textContent=body||"";
  d.onclick=()=>{ d.remove(); if(go) go(); }; document.body.appendChild(d); setTimeout(()=>d.remove(),6000);
  try{ if(document.hidden && "Notification" in window && Notification.permission==="granted"){
    const opt={body:body||"",icon:"icon-192.png",badge:"icon-192.png",tag:title+body};
    if(navigator.serviceWorker&&navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r=>r.showNotification(title,opt)); else new Notification(title,opt); } }catch(e){}
}

function diff(kind,list,fn){
  const prev=seen[kind], now={}; list.forEach(x=>now[x.id]=x);

}

  const clamp=()=>{ if(sc<=1){ sc=1;tx=0;ty=0; return; } const mx=im.clientWidth*(sc-1)/2, my=im.clientHeight*(sc-1)/2; tx=Math.max(-mx,Math.min(mx,tx)); ty=Math.max(-my,Math.min(my,ty)); };
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  const close=()=>d.remove();
  d.querySelector(".zx").onclick=e=>{ e.stopPropagation(); close(); };
  d.addEventListener("touchstart",e=>{ moved=false;
    if(e.touches.length===2) st={pinch:1,d0:dist(e.touches),s0:sc};
    else if(e.touches.length===1) st={x:e.touches[0].clientX,y:e.touches[0].clientY,tx0:tx,ty0:ty};
  },{passive:true});
  d.addEventListener("touchmove",e=>{ if(!st) return; e.preventDefault(); moved=true;
    if(st.pinch&&e.touches.length===2){ sc=Math.max(1,Math.min(5,st.s0*dist(e.touches)/st.d0)); apply(); }
    else if(!st.pinch&&e.touches.length===1&&sc>1){ tx=st.tx0+e.touches[0].clientX-st.x; ty=st.ty0+e.touches[0].clientY-st.y; apply(); }
  },{passive:false});
  d.addEventListener("touchend",e=>{ if(e.touches.length) return; clamp(); apply(true); st=null; },{passive:true});
  d.addEventListener("click",e=>{ if(e.target.closest(".zx")) return;
    const now=Date.now();
    if(now-lastTap<300){ if(sc>1){ sc=1;tx=0;ty=0; } else { sc=2.5; const r=im.getBoundingClientRect(); tx=(r.left+r.width/2-e.clientX)*1.5; ty=(r.top+r.height/2-e.clientY)*1.5; clamp(); } apply(true); lastTap=0; return; }
    lastTap=now; setTimeout(()=>{ if(lastTap===now && sc===1 && !moved && e.target!==im) close(); },320);
  });
  d.addEventListener("wheel",e=>{ e.preventDefault(); sc=Math.max(1,Math.min(5,sc*(e.deltaY<0?1.15:0.87))); clamp(); apply(); },{passive:false});
}

/* ===== ⟳ pull down to refresh ===== */
(function(){
  let p=null; const TH=80;
  const ind=()=>{ let el=document.getElementById("ptr"); if(!el){ el=document.createElement("div"); el.id="ptr"; el.innerHTML="<span>⟳</span>"; document.body.appendChild(el);} return el; };
  const blocked=()=>document.querySelector(".zoom,.lmenu,.ccov,#intro,.pagev") || document.body.classList.contains("chatv") || INPUT_VIEWS.includes(view) || window.scrollY>0;
  document.addEventListener("touchstart",e=>{
    if(e.touches.length!==1||blocked()) return;
    const x=e.touches[0].clientX; if(x<=30||x>=window.innerWidth-30) return; // leave the edges to swipe-back
    p={y0:e.touches[0].clientY,dy:0};
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!p) return; p.dy=e.touches[0].clientY-p.y0;
    if(p.dy<=0||window.scrollY>0){ const el=document.getElementById("ptr"); if(el){el.style.opacity=0;} if(p.dy<-10) p=null; return; }
    const el=ind(), d=Math.min(p.dy*0.5,90);
    el.style.transition="none"; el.style.opacity=Math.min(1,d/50); el.style.transform=`translate(-50%,${d-50}px) rotate(${d*4}deg)`;
  },{passive:true});
  document.addEventListener("touchend",()=>{
    if(!p) return; const go=p.dy*0.5>=TH*0.75; p=null; const el=document.getElementById("ptr"); if(!el) return;
    el.style.transition="transform .2s, opacity .2s";
    if(go){ el.classList.add("spin"); el.style.transform="translate(-50%,30px)";
      // soft refresh: stay on the same page, no opening logo, just redraw with the latest data
      setTimeout(()=>{ try{ document.querySelectorAll("img[data-img]").forEach(i=>{ if(!i.src) delete imgCache[i.dataset.img]; }); if(me) render(); else location.reload(); }catch(e){ console.warn(e); }
        setTimeout(()=>{ el.classList.remove("spin"); el.style.opacity=0; el.style.transform="translate(-50%,-60px)"; },450); },500); }
    else { el.style.opacity=0; el.style.transform="translate(-50%,-60px)"; }
  },{passive:true});
})();

  const pend=shops.filter(s=>s.status==="pending");
  A(`<div class="stats" style="margin-top:14px">
      <div class="stat"><b>${users.filter(u=>u.role==="customer").length}</b><small>${t("customers")}</small></div>
      <div class="stat"><b>${shops.filter(s=>s.status==="approved").length}</b><small>${t("businesses")}</small></div>
      <div class="stat"><b>${allOrders.length}</b><small>${t("all_orders")}</small></div>
      <div class="stat"><b>${allBookings.length}</b><small>${t("seg_bookings")}</small></div>
      <div class="stat"><b>${listings.filter(l=>l.status==="active").length}</b><small>${t("sec_market")}</small></div>
      <div class="stat"><b>${money(allOrders.filter(o=>o.status==="delivered").reduce((a,o)=>a+o.sub,0))}</b><small>${t("delivered_sales")}</small></div></div>
    <button class="btn light" onclick="go('aorders')">${t("all_activity")}</button>
    <button class="btn ${reports.length?'red':'light'}" onclick="go('areports')">${t("reports_t")} (${reports.length})</button>
    <h2>${t("pending_title")} (${pend.length})</h2>`+
    (pend.length?pend.map(bizAdminCard).join(""):`<div class="empty">${t("none_pending")}</div>`)+accountBox());
}
function bizAdminCard(s){
  const n=allOrders.filter(x=>x.shopId===s.id).length+allBookings.filter(x=>x.bizId===s.id).length;
  const acts={pending:[["approved","approve","green"],["suspended","reject","red"]],approved:[["suspended","suspend","red"]],suspended:[["approved","reactivate","green"]]}[s.status]||[];
  return `<div class="order"><div class="top"><b>${s.icon} ${esc(s.name)}</b>${shTag(s.status)}</div>
    <div class="hint">${CATS[catOf(s)].icon} ${t("sec_"+catOf(s))}${s.sub?" · "+t("sub_"+s.sub):""} · ${esc(s.type)}${s.area?" · 📍 "+esc(s.area):""}<br>${modeOf(s)==="order"?`${(s.menu||[]).length} ${t("products_n")} · `:""}${n} ${t("orders_n")}<br>${t("shop_owner_lbl")} ${esc(s.ownerName||"")} — <span dir="ltr">${esc(s.ownerPhone||"")}</span></div>
    ${acts.map(([st,l,c])=>`<button class="btn sm ${c}" onclick="setShopStatus('${s.id}','${st}')">${t(l)}</button>`).join("")}</div>`;
}
function setShopStatus(id,st){ save(()=>fs.updateDoc(fs.doc(fdb,"shops",id),{status:st})); }
function vAdminBiz(){
  H(t("businesses")+" 🏪",`${shops.length}`);
  const list=shops.filter(s=>adminFilter==="all"||s.status===adminFilter);
  A(chips(["all","pending","approved","suspended"],adminFilter,"adminFilter",k=>t("f_"+k))+(list.length?list.map(bizAdminCard).join(""):`<div class="empty">${t("none")}</div>`));
}
function vAdminMarket(){
  H("🏷️ "+t("sec_market"),`${listings.length} ${t("ads_n")}`);
  A(`<br>`+(listings.length?listings.map(l=>`<div class="order"><div class="top"><b>${MCI[l.cat]||""} ${esc(l.title)}</b>${lTag(l.status)}</div>
    <div class="row"><span>${money(l.price)}</span><span class="muted">${ago(l.time)}</span></div>
    <div class="hint">${t("seller")} ${esc(l.ownerName)} — <span dir="ltr">${esc(toLocal(l.phone))}</span></div>
    <button class="btn sm light" onclick="openListing('${l.id}')">👁</button>
    ${l.status!=="removed"?`<button class="btn sm red" onclick="setL('${l.id}','removed')">${t("remove_l")}</button>`:`<button class="btn sm green" onclick="setL('${l.id}','active')">${t("restore_l")}</button>`}</div>`).join(""):`<div class="empty">${t("market_empty")}</div>`));
}
function vAdminUsers(){
  H(t("users_title"),`${users.length} ${t("accounts_n")}`);
  const R={customer:"t-gray",owner:"t-blue",admin:"t-orange"};
  A(resetBox()+`<br>`+[...users].sort((a,b)=>(b.created||0)-(a.created||0)).map(u=>`<div class="order"><div class="top"><b>${esc(u.name)}</b>${tag([t("r_"+u.role),R[u.role]||"t-gray"])}</div>
    <div class="hint"><span dir="ltr">📞 ${esc(u.phone)}</span> · ${allOrders.filter(o=>o.customerId===u.id).length} ${t("orders_n")} ${u.blocked?" · "+tag([t("f_suspended"),"t-red"]):""}</div>
    ${u.role!=="admin"?`<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm ${u.blocked?'green':'red'}" onclick="toggleBlock('${u.id}',${!u.blocked})">${u.blocked?t("unblock"):t("block")}</button>${u.login&&!u.email?`<button class="btn sm light" onclick="adminSetPw('${esc(u.phone)}','')">🔑 ${t("rq_set")}</button>`:""}</div>`:""}</div>`).join(""));
}
function toggleBlock(id,val){ save(()=>fs.updateDoc(fs.doc(fdb,"users",id),{blocked:val})); }
function vAdminOrders(){
  H(t("all_activity"),"",backBtn("setTab('overview')"));
  const S=[["orders","tab_orders"],["bookings","seg_bookings"]]; if(seg==="listings") seg="orders";
  A(`<div class="seg">${S.map(([k,l])=>`<button class="${seg===k?'on':''}" onclick="seg='${k}';go('aorders',true)">${t(l)}</button>`).join("")}</div><br>`+
    (seg==="orders"?(allOrders.length?allOrders.map(o=>orderCard(o,"",true)).join(""):`<div class="empty">${t("no_orders_a")}</div>`)
                   :(allBookings.length?allBookings.map(b=>bkCard(b,"",true)).join(""):`<div class="empty">${t("no_bookings")}</div>`)));
}

applyLang();
render();
init();
try{ if(sessionStorage.getItem("introSeen")){ const el=document.getElementById("intro"); if(el) el.remove(); } sessionStorage.setItem("introSeen","1"); }catch(e){}
setTimeout(()=>{ const el=document.getElementById("intro"); if(!el) return; el.style.opacity="0"; setTimeout(()=>el.remove(),550); },2300);
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
